title: Tuyển dụng
description: WOTU tuyển thợ mộc, thợ thi công, kiến trúc sư và kinh doanh tại Quy Nhơn. Studio thiết kế & xưởng nội thất — môi trường làm nghề tử tế, gắn bó lâu dài. Nộp hồ sơ ngay trên web.
hero:
  eyebrow: Tuyển dụng
  heading: Làm nghề tử tế, <em>cùng WOTU</em>.
  intro: WOTU là studio thiết kế và xưởng nội thất tại Quy Nhơn — tự tay đóng từng món đồ, thi công tận công trình, bảo hành dài. Chúng tôi luôn tìm người yêu nghề, chịu học và muốn gắn bó lâu dài. Nếu đó là bạn, xem các vị trí bên dưới rồi để lại hồ sơ.
positionsHeading: Vị trí <em>đang tuyển</em>
positions:
  - title: Thợ mộc / thợ xưởng
    summary: Gia công gỗ, vận hành máy CNC, chà nhám và sơn hoàn thiện tại xưởng Quy Nhơn.
    requirements:
      - Biết đọc bản vẽ cơ bản, dùng được máy mộc
      - Cẩn thận, chắc tay, có gu hoàn thiện tỉ mỉ
      - Ưu tiên có kinh nghiệm đồ gỗ nội thất
  - title: Thợ thi công / lắp đặt
    summary: Vận chuyển, lắp đặt nội thất và hoàn thiện tại công trình cho khách Quy Nhơn & lân cận.
    requirements:
      - Sức khoẻ tốt, chịu được đi công trình
      - Khéo tay, xử lý được tình huống tại chỗ
      - Có xe máy, ưu tiên biết lái xe tải nhẹ
  - title: Kiến trúc sư / thiết kế nội thất
    summary: Lên concept, dựng 3D và triển khai bản vẽ kỹ thuật cho nhà ở, căn hộ, thương mại.
    requirements:
      - Thành thạo phần mềm 3D (SketchUp/3ds Max) + dựng bản vẽ
      - Có gu thẩm mỹ, hiểu vật liệu và thi công thực tế
      - Portfolio là một điểm cộng lớn
  - title: Kinh doanh / marketing
    summary: Tư vấn, báo giá, chốt đơn và xây kênh truyền thông cho WOTU tại Quy Nhơn.
    requirements:
      - Giao tiếp tốt, hiểu nhu cầu khách làm nhà
      - Chủ động, theo sát khách từ tư vấn tới bàn giao
      - Ưu tiên từng làm nội thất / xây dựng / bất động sản
cultureHeading: Vì sao làm việc <em>ở WOTU</em>
culture:
  - icon: 🪵
    heading: Xưởng riêng, việc đều
    text: WOTU có xưởng sản xuất riêng tại Quy Nhơn — công việc ổn định quanh năm, không phải chạy job từng buổi.
  - icon: 📐
    heading: Học được nghề thật
    text: Làm cùng đội ngũ từ thiết kế tới thi công — thợ mới được kèm, người có nghề được giao việc khó để lên tay.
  - icon: 🤝
    heading: Làm ăn tử tế
    text: "\"We don't sell furniture, we sell satisfaction\" — với khách và với anh em trong nhà đều vậy: rõ ràng, giữ lời."
  - icon: 🏠
    heading: Gần nhà, gắn bó lâu
    text: Việc ngay tại Quy Nhơn & Bình Định — không phải đi xa, phù hợp người muốn ổn định lâu dài.
benefitsHeading: Quyền lợi
benefitsNote: Số cụ thể trao đổi trực tiếp khi phỏng vấn — dưới đây là khung chung.
benefits:
  - "Thu nhập: thoả thuận theo tay nghề & vị trí trong lúc phỏng vấn"
  - "Thưởng: theo hiệu quả công việc, lễ tết đều có thưởng."
  - "Chế độ: phụ cấp, nghĩ lễ theo thực tế công ty"
  - Được đào tạo nghề, làm việc tại xưởng & công trình ngay tại Quy Nhơn
  - Môi trường trẻ, việc đều quanh năm, cơ hội gắn bó và thăng tiến lâu dài
faqHeading: Hỏi nhanh về <em>tuyển dụng</em>
faq:
  - q: WOTU làm việc ở đâu?
    a: Xưởng và văn phòng tại Lô 17-18 Hoa Lư, Quy Nhơn, Gia Lai. Thợ thi công đi công trình trong Quy Nhơn và các khu vực lân cận.
  - q: Chưa nhiều kinh nghiệm có ứng tuyển được không?
    a: Được. Với vị trí thợ, WOTU nhận cả người mới chịu học — sẽ được kèm nghề. Quan trọng là thái độ và sự chịu khó.
  - q: Nộp hồ sơ thế nào?
    a: Điền form bên dưới (chọn vị trí, để lại số điện thoại và link CV nếu có). Hoặc gửi CV qua email hello@wotu.vn / gọi trực tiếp hotline hoặc zalo.
  - q: Bao lâu WOTU phản hồi?
    a: Chúng tôi xem hồ sơ và liên hệ lại trong vài ngày làm việc. Hồ sơ phù hợp sẽ được hẹn gặp trực tiếp tại xưởng.
formHeading: Nộp hồ sơ <em>ứng tuyển</em>
formIntro: Để lại thông tin — WOTU sẽ liên hệ lại. Có link CV (Google Drive, hồ sơ online) thì dán vào giúp chúng tôi.
formSuccess: Cảm ơn bạn đã ứng tuyển — WOTU sẽ xem hồ sơ và liên hệ lại sớm.
positionOther: Vị trí khác
