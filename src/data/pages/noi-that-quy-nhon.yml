  - id: faq
    type: faq
    heading: "Hỏi nhanh về <em>nội thất Quy Nhơn</em>"
    items:
      - question: "Mua nội thất ở Quy Nhơn thì đến đâu xem trực tiếp được?"
        answer: "<p>Ghé xưởng WOTU tại <strong>Lô 17-18 Hoa Lư, Quy Nhơn, Gia Lai</strong>, mở cửa thứ 2–thứ 7, 8h–17h30. Có mẫu vật liệu, màu sơn và sản phẩm thật để xem tận tay. Gọi trước <strong>0933 774 708</strong> để có tư vấn viên đón bạn.</p>"
        open: true
      - question: "Một bộ nội thất trọn phòng ở Quy Nhơn giá khoảng bao nhiêu?"
        answer: "<p>Combo WOTU niêm yết từ <strong>8.900.000đ</strong> (góc làm việc) đến <strong>45.000.000đ</strong> (full căn hộ studio 30m², 11 món, trả góp 0%). Phòng khách trọn bộ 18.900.000đ, phòng ngủ master 22.500.000đ. Xem đầy đủ tại <a href='/combo/'>trang combo</a>.</p>"
      - question: "Đặt hôm nay thì bao lâu có đồ?"
        answer: "<p>Hàng có sẵn: giao trong <strong>48 giờ</strong> ở Quy Nhơn. Hàng catalog: 5–10 ngày. Đóng riêng theo kích thước: 20–30 ngày. Combo trọn phòng: dọn vào ở trong 7–28 ngày tuỳ gói.</p>"
      - question: "WOTU có nhận thiết kế và thi công trọn gói cả căn không?"
        answer: "<p>Có, đó là <a href='/studio/'>WOTU Studio</a>: kiến trúc sư đo đạc, dựng 3D cho xem trước, thiết kế theo đúng căn nhà bạn, rồi đồ gỗ đóng tại xưởng WOTU. Nhận nhà phố, biệt thự, căn hộ và cải tạo trọn gói từ thô đến hoàn thiện.</p>"
      - question: "Giao và lắp đặt có mất phí không? Ngoài Quy Nhơn có giao không?"
        answer: "<p>Miễn phí giao và lắp đặt tận nhà tại <strong>Quy Nhơn, Gia Lai</strong> với đội kỹ thuật riêng của WOTU, không qua bên thứ ba. Ngoài tỉnh vẫn giao toàn quốc bằng xe chuyên dụng, phí tính theo khoảng cách và báo trước khi bạn xác nhận. Chi tiết: <a href='/giao-hang-lap-dat/'>Giao hàng &amp; lắp đặt</a>.</p>"
      - question: "Bảo hành thế nào nếu đồ có vấn đề?"
        answer: "<p>Khung gỗ và cấu trúc chính bảo hành <strong>2 năm</strong>, gấp đôi mặt bằng thị trường. Nội thất rời không vừa ý được đổi trả trong <strong>7 ngày</strong>. Chi tiết từng hạng mục: <a href='/bao-hanh-doi-tra/'>Bảo hành &amp; đổi trả</a>.</p>"
      - question: "Gỗ WOTU dùng là gỗ gì, có phải gỗ tự nhiên không?"
        answer: "<p>Chủ yếu là <strong>gỗ cao su</strong> và <strong>gỗ tần bì</strong> tự nhiên, bền, ít cong vênh, vân đẹp, sấy đạt độ ẩm 8–12% trước khi gia công. Dòng cao cấp có óc chó, sồi theo yêu cầu. Ván công nghiệp (nếu dùng cho hạng mục phù hợp) có hoá đơn 100%.</p>"
      - question: "Đặt hàng cần cọc bao nhiêu, thanh toán ra sao?"
        answer: "<p>Quy trình: báo giá trong 24h → ký hợp đồng, cọc <strong>30%</strong> → sản xuất → giao lắp → thanh toán phần còn lại khi nghiệm thu. Nhận chuyển khoản, MoMo hoặc tiền mặt tại xưởng.</p>"

