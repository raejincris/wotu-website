:right;'><strong>18.900.000đ</strong></td></tr><tr><td style='padding:10px 12px; border-bottom:1px solid rgba(0,0,0,.08);'><a href='/combo/an-yen/'>An Yên</a>, phòng ngủ master</td><td style='padding:10px 12px; border-bottom:1px solid rgba(0,0,0,.08);'>Giường 1m8 · tủ áo 4 cánh · bàn trang điểm</td><td style='padding:10px 12px; border-bottom:1px solid rgba(0,0,0,.08); text-align:right;'><strong>22.500.000đ</strong></td></tr><tr><td style='padding:10px 12px;'><a href='/combo/an-cu/'>An Cư</a>, full căn studio 30m²</td><td style='padding:10px 12px;'>Trọn bộ 11 món, trả góp 0% trong 12 tháng</td><td style='padding:10px 12px; text-align:right;'><strong>45.000.000đ</strong></td></tr></tbody></table><p style='margin-top:14px;'>Cần thiết kế &amp; thi công riêng cả căn? Chi phí phụ thuộc diện tích, vật liệu và hạng mục. WOTU đo đạc, dựng 3D và <strong>báo giá chi tiết trong 24 giờ</strong>, miễn phí, không ràng buộc. <a href='/studio/'>Xem cách Studio làm việc →</a></p>"
