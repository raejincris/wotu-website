    body: "<p><strong>WOTU là xưởng nội thất tại Quy Nhơn (Lô 17-18 Hoa Lư, Quy Nhơn, Gia Lai), làm nội thất từ 2022.</strong> Chúng tôi phục vụ theo hai cách: <a href='/combo/'>combo nội thất đóng sẵn</a>: chọn hôm nay, dọn vào ở trong 7–28 ngày; hoặc <a href='/studio/'>thiết kế &amp; thi công riêng</a> cả căn nhà, từ bản vẽ đến bàn giao, đồ gỗ đóng tại chính xưởng của mình.</p><p>Không qua trung gian, không hàng trôi nổi. Bạn có thể ghé xưởng xem tận tay tấm gỗ sẽ thành tủ áo nhà mình. Đó là cách một đơn vị nội thất địa phương nên làm việc.</p>"
