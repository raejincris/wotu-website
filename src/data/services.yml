        a: "Chênh lệch nằm ở ba thứ: loại gỗ (gỗ công nghiệp phủ melamine ở mức thấp, gỗ tự nhiên như sồi hoặc óc chó ở mức cao), ngũ kim (ray trượt và bản lề giảm chấn nhập khẩu đắt hơn hàng phổ thông đáng kể), và độ phức tạp của hệ tủ. WOTU báo giá tách riêng từng phần để bạn thấy rõ tiền đi vào đâu."
      - q: "Tủ bếp gỗ có bị cong vênh ở Quy Nhơn không?"
        a: "Có, nếu gỗ không được sấy đúng. Khí hậu biển độ ẩm cao khiến gỗ chưa sấy kỹ cong vênh và bung mối nối chỉ sau một mùa mưa. Gỗ tại xưởng WOTU được sấy đạt độ ẩm 8–12% trước khi gia công, và chúng tôi bảo hành khung gỗ 2 năm."
      - q: "Đóng tủ bếp mất bao lâu?"
        a: "Thường 2–3 tuần kể từ khi chốt bản vẽ: khoảng 10–14 ngày sản xuất tại xưởng và 1–2 ngày lắp đặt tại nhà. Nếu làm cùng lúc với hạng mục khác trong nhà, chúng tôi xếp lịch để không phải dọn nhà nhiều lần."
      - q: "Có làm tủ bếp cho căn hộ chung cư không?"
        a: "Có. Căn hộ chung cư thường vướng trần thấp và hộp kỹ thuật, nên phần đo đạc quan trọng hơn nhà phố. Chúng tôi đã làm bếp cho căn hộ ở FLC Sea Tower và TMS, đều là chung cư tại Quy Nhơn."
    relatedHeading: "Những căn bếp chúng tôi đã làm"

